name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

# id-token: write is required for npm trusted publishing (OIDC).
# contents/pull-requests: write are required by changesets/action to push the
# release branch and open the release PR, and by the tag/release steps below.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # @changesets/cli v3 requires Node >= 22.8 (it calls
          # module.enableCompileCache unconditionally).
          node-version: 24
          cache: 'pnpm'

      # Trusted publishing requires npm >= 11.5.1.
      - name: Update npm for trusted publishing
        run: npm install -g npm@11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Detect pending changesets before the action runs, so the publish gate
      # below does not depend on the action's output names (hasChangesets was
      # renamed to has-changesets in v2; a stale name silently skips publish).
      - name: Check for pending changesets
        id: pending
        shell: bash
        run: |
          if find .changeset -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v2
        with:
          # changesets/action v2 renamed version/commit/title to these names
          version-script: pnpm changeset version
          commit-message: "chore: release"
          pr-title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishing runs outside changesets/action so that npm authenticates via
      # OIDC (trusted publishing) with no token and no .npmrc involved.
      # When changesets are pending this push only updated the release PR, so
      # publishing is skipped; when none are pending (the release PR was just
      # merged) this publishes any version not yet on the registry.
      # Whether a publish is needed is decided by asking the registry, not by
      # parsing changeset output (its log format changed in @changesets/cli v3).
      - name: Publish to npm
        id: publish
        if: steps.pending.outputs.changesets == 'false'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "nestjs-mixpanel@${VERSION}" version >/dev/null 2>&1; then
            echo "nestjs-mixpanel@${VERSION} is already on the registry; nothing to publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            pnpm changeset publish
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Push Git Tag and Create GitHub Release
        if: steps.publish.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          git push origin --tags
          awk -v ver="$VERSION" '$0 == "## " ver {flag=1; next} /^## / {flag=0} flag' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "v${VERSION}" --title "v${VERSION}" --notes-file release-notes.md
          else
            gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
          fi
          echo "🎉 Successfully published v${VERSION} to npm"
