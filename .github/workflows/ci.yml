name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }} / NestJS ${{ matrix.nest-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        # devDependencies pin the newest supported NestJS major; the include
        # below adds one job against the oldest supported major.
        nest-version: [12]
        include:
          - node-version: 22
            nest-version: 11
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install NestJS ${{ matrix.nest-version }}
        if: matrix.nest-version != 12
        run: pnpm add -D @nestjs/common@^11.0.0 @nestjs/core@^11.0.0 @nestjs/platform-express@^11.0.0 @nestjs/testing@^11.0.0

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          # The memory-leak e2e test forces GC between measurements; without
          # --expose-gc its per-request threshold is at the mercy of GC timing
          # and fails intermittently (observed on Node 24 runners).
          NODE_OPTIONS: --expose-gc

      - name: Build
        run: pnpm build
